name: Build desktop clients
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
            target: --win --x64
          - runner: macos-15
            platform: darwin
            arch: arm64
            target: --mac --arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: --mac --x64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: engine/go.sum
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: |
            resources/${{ matrix.platform }}-${{ matrix.arch }}/ffmpeg*
            resources/${{ matrix.platform }}-${{ matrix.arch }}/FFmpeg-*.txt
            resources/${{ matrix.platform }}-${{ matrix.arch }}/*-LICENSE.txt
            resources/${{ matrix.platform }}-${{ matrix.arch }}/manifest.json
          key: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-ffmpeg-mac.cjs', 'scripts/fetch-ffmpeg.cjs') }}
      - run: pnpm run engine
      - name: Mac compiler dependencies
        if: matrix.platform == 'darwin' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install pkgconf nasm
      - run: pnpm run ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      - run: pnpm run check
      - run: pnpm test
      - name: Engine regression tests
        working-directory: engine
        run: go test ./internal/app ./internal/xiaomi ./pkg/h265 ./pkg/tutk ./pkg/xiaomi/miss/...
      - name: Install test browser
        run: pnpm exec playwright install chromium
      - name: UI flows
        run: pnpm exec playwright test
      - name: Package clients
        run: pnpm build ${{ matrix.target }} --publish never
      - name: Packaged native client smoke
        run: node scripts/smoke-packaged.cjs
      - name: Artifact checksums
        run: node scripts/checksums.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release/*
          body: |
            初版客户端：Windows x64、macOS Apple 芯片和 Intel。
            安装包自带播放引擎、浏览器运行时和 FFmpeg。
            Windows 真实摄像头、Mac 真实摄像头及 16 路负载验收待主机上线后完成。
            初版未配置 Windows 代码签名或 Apple Developer ID 公证。
