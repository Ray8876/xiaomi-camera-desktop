name: Publish verified v0.1.2 artifacts
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '41565775028'
      BUILD_SHA: 'ea2e8f0a9f340c488a5de953f5cf547b6c9fc116'
    steps:
      - uses: actions/checkout@v4
      - name: Verify original build
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --json status,conclusion,headSha --jq 'select(.status == "completed" and .conclusion == "success" and .headSha == env.BUILD_SHA) | .headSha' | grep -Fx "$BUILD_SHA"
      - name: Download and verify installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          for platform in win32-x64 darwin-arm64 darwin-x64; do
            mkdir -p "release/$platform"
            gh run download "$BUILD_RUN" --name "client-$platform" --dir "release/$platform"
            (cd "release/$platform" && sha256sum -c "SHA256SUMS-$platform.txt")
          done
          test "$(find release -name '*.exe' | wc -l)" -eq 1
          test "$(find release -name '*.dmg' | wc -l)" -eq 2
          test "$(find release -name '*.zip' | wc -l)" -eq 2
          test "$(find release -name 'SHA256SUMS-*.txt' | wc -l)" -eq 3
      - name: Create and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.2 --target "$BUILD_SHA" --title 'v0.1.2 试用版' --notes-file .github/release-notes/v0.1.2.md --draft --prerelease
          find release -type f -print0 | xargs -0 gh release upload v0.1.2
          gh release edit v0.1.2 --draft=false --prerelease
